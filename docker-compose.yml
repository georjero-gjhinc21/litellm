# LiteLLM quickstart stack: the gateway plus a Postgres database that stores
# models, virtual keys, and spend logs. Used by https://docs.litellm.ai/docs/proxy/docker_quick_start
#
# Start it directly:
#   curl -sSL https://docs.litellm.ai/docker-compose.yml | docker compose -f - up -d
#
# LITELLM_MASTER_KEY, LITELLM_SALT_KEY, UI_USERNAME and UI_PASSWORD are no
# longer hardcoded here - scripts/load_secrets_from_bitwarden.sh writes them
# (plus OPENCODE_API_KEY) to .env from Bitwarden immediately before `up`, and
# pull_deploy.sh/run_daily.sh shred .env again right after the container has
# picked them up. Before any real use, pin the image to a release tag instead
# of `latest`.
services:
  litellm:
    image: docker.litellm.ai/berriai/litellm-database:latest
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run scripts/load_secrets_from_bitwarden.sh first}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run scripts/load_secrets_from_bitwarden.sh first}
      UI_VISIBLE_MODELS: "True"
      UI_USERNAME: ${UI_USERNAME:?run scripts/load_secrets_from_bitwarden.sh first}
      UI_PASSWORD: ${UI_PASSWORD:?run scripts/load_secrets_from_bitwarden.sh first}
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      STORE_MODEL_IN_DB: "False"
      CONFIG_FILE: /app/config.yaml
    command: ["--port", "4000", "--config", "/app/config.yaml"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
