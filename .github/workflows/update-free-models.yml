name: update-free-models

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: free-models
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Run free-model updater
        id: update
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          python3 scripts/update_free_models.py || [ $? -eq 1 ] || true

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # self-committing also resets GitHub's 60-day public-repo inactivity timer
          git add config.yaml last_report.json
          if git diff --cached --quiet; then
            echo "No model changes; pushing a heartbeat commit to keep schedule alive"
            git commit --allow-empty -m "chore: daily heartbeat $(date -u +%Y-%m-%d)" || true
          else
            git commit -m "chore: refresh free models $(date -u +%Y-%m-%d)" || true
          fi
          git push origin HEAD